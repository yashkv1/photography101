<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photography 101</title>
<style>
:root{--bg:#f7f6f2;--card:#ffffff;--soft:#efede6;--text:#1f1e1b;--muted:#6b6a64;--line:#dcdad2;--accent:#2f6fd6;--accent-bg:#e6eefb;--warn:#a3561a;--warn-bg:#fbefe2;--good:#2f7a3a;--good-bg:#e7f3e6;--cone:#e8a33a}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b19;--card:#252523;--soft:#2f2f2c;--text:#ecebe6;--muted:#a3a29b;--line:#3d3d39;--accent:#7aa7f0;--accent-bg:#1e3150;--warn:#f0b07a;--warn-bg:#40291a;--good:#8fd19a;--good-bg:#1f3a22}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:24px;font-weight:600;margin:0}
h2{font-size:17px;font-weight:600;margin:0 0 10px}
h3{font-size:14px;font-weight:600;margin:0 0 4px}
.sub{color:var(--muted);margin:4px 0 18px;font-size:15px}
.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
label.lbl{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=search],select{width:100%;font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
input[type=range]{width:100%;accent-color:var(--accent)}
.err{color:var(--warn);font-size:13px;margin-top:4px}
.hint{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
button{font:inherit;font-size:13px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
button:hover{background:var(--soft)}
button.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.lenslist{max-height:520px;overflow:auto;margin:0 -6px;padding:0 6px}
.lensbtn{display:block;width:100%;text-align:left;padding:8px 10px;margin-bottom:6px;border-radius:8px}
.lensbtn .nm{font-weight:600;font-size:13.5px}
.lensbtn .sp{color:var(--muted);font-size:12.5px}
.badge{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--soft);color:var(--muted);margin-left:6px;vertical-align:1px}
.lenshead{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline}
.lenshead .big{font-size:19px;font-weight:600}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.fact{background:var(--soft);border-radius:8px;padding:4px 10px;font-size:13px}
.ctl{display:grid;grid-template-columns:110px minmax(0,1fr) 92px;gap:10px;align-items:center;margin:10px 0}
.ctl .v{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.ctl .n{font-size:14px;color:var(--muted)}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px 120px}
@media (max-width:560px){.ctl{grid-template-columns:80px minmax(0,1fr) 80px}.presets{margin-left:0}}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px}
.metric{background:var(--soft);border-radius:10px;padding:10px 12px}
.metric .k{font-size:12.5px;color:var(--muted)}
.metric .val{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
.metric .s{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.view svg{width:100%;height:auto;display:block;border-radius:8px}
.cap{font-size:13px;color:var(--muted);margin-top:6px}
.note{border-radius:8px;padding:8px 12px;font-size:13.5px;margin-top:10px}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.good{background:var(--good-bg);color:var(--good)}
ul.why{margin:0;padding-left:18px}
ul.why li{margin:6px 0}
.learn{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.learn .item{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13.5px}
.diag text{font-family:inherit}

.lensbar{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);gap:4px 14px;align-items:start}
.lensbar .lbl{margin-top:0}
@media (max-width:860px){.lensbar{grid-template-columns:minmax(0,1fr)}}
.layout2{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.layout2{grid-template-columns:minmax(0,1fr)}.modnav{display:flex;flex-wrap:wrap;gap:6px;position:static}.modnav .modbtn{width:auto}.modnav .hint,.modnav .progress{width:100%}}
.modnav{position:sticky;top:12px}
.modbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:none;padding:7px 8px;margin:2px 0;font-size:14px}
.modbtn.on{background:var(--accent-bg);color:var(--accent)}
.num{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--soft);font-size:12px;font-weight:600;flex:none}
.num.ok{background:var(--good-bg);color:var(--good)}
.progress{height:6px;border-radius:3px;background:var(--soft);margin-bottom:10px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--good);transition:width .3s}
.reset{margin-top:10px;font-size:12px;color:var(--muted)}
.idea{background:var(--accent-bg);border-radius:8px;padding:8px 12px;font-size:14px}
.ctl select{font-size:14px;padding:6px 8px}
ol.tasks{list-style:none;padding:0;margin:8px 0 16px}
ol.tasks li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;margin-bottom:6px;background:var(--soft);font-size:14.5px}
ol.tasks li.done{background:var(--good-bg);color:var(--good)}
ol.tasks li.locked{opacity:.55}
ol.tasks li.active{outline:2px solid var(--accent)}
.tick{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:12px;margin-top:1px}
.quiz{border-top:1px solid var(--line);padding-top:12px}
.opts{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.opts button{text-align:left;font-size:14px}
.opts button.right{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.opts button.wrong{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.navbtns{display:flex;justify-content:space-between;margin-bottom:16px}
.navbtns button{font-size:14px;padding:8px 14px}
.navbtns button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.4;cursor:default}
svg.diag{width:100%;max-width:520px;height:auto;display:block}
footer{color:var(--muted);font-size:12.5px;margin-top:8px}
</style>
</head>
<body>
<div id="app"></div>

function parseLens(text){
  const t = String(text || '');
  const fm = t.match(/(\d+(?:\.\d+)?)(?:\s*[-–]\s*(\d+(?:\.\d+)?))?\s*(?:mm?)?/i);
  if (!fm) return null;
  const f0 = +fm[1], f1 = fm[2] ? +fm[2] : f0;
  const rest = t.slice(fm.index + fm[0].length);
  const am = rest.match(/(?:f\s*\/?|1\s*:)\s*(\d+(?:\.\d+)?)(?:\s*[-–]\s*(\d+(?:\.\d+)?))?/i);
  if (!am) return null;
  const a0 = +am[1], a1 = am[2] ? +am[2] : a0;
  if (!(f0 >= 4 && f1 >= f0 && f1 <= 2000 && a0 >= 0.95 && a1 >= a0 && a1 <= 16)) return null;
  return {f:[f0,f1], a:[a0,a1]};
}

const LENSES = RAW.map(([n,cat,fmt,is,bp],i) => ({id:'l'+i, n, cat, fmt, is:!!is, bp, ...parseLens(n), brand:n.split(' ')[0]}));

function sensorFor(lens, current){
  if (lens.fmt === 'FF') return 'ff';
  if (lens.fmt === 'MFT') return 'mft';
  if (lens.fmt === 'APS-C') return lens.brand === 'Canon' ? 'canon' : 'apsc';
  return current;
}
function nearestLog(list, x){ return list.reduce((p,c) => Math.abs(Math.log(c/x)) < Math.abs(Math.log(p/x)) ? c : p); }
function maxApAt(lens, f){
  if (lens.bp){ let N = lens.bp[0][1]; for (const [fs,n] of lens.bp) if (f >= fs) N = n; return {N, est:false}; }
  const [f0,f1] = lens.f, [a0,a1] = lens.a;
  if (f1 === f0 || a0 === a1 || f <= f0) return {N:a0, est:false};
  if (f >= f1) return {N:a1, est:false};
  const t = Math.log(f/f0) / Math.log(f1/f0);
  const raw = a0 * Math.pow(a1/a0, t);
  const cands = [a0, ...STD.filter(s => s > a0 + 0.01 && s < a1 - 0.01), a1];
  return {N: nearestLog(cands, raw), est:true};
}
const fN = n => (Math.round(n*10)/10).toString();
const stopsBetween = (n1, n2) => 2 * Math.log2(n2/n1);
function fmtShutter(t){
  if (t >= 1) return (t < 10 ? (Math.round(t*10)/10) : Math.round(t)) + 's';
  return '1/' + nearestLog(SHUT, 1/t);
}
function fmtDist(m, fine){
  if (!isFinite(m)) return '∞';
  if (m < 0.1) return (Math.round(m*1000)/10) + 'cm';
  if (m < 1) return Math.round(m*100) + 'cm';
  if (fine) return (Math.round(m*100)/100) + 'm';
  if (m < 10) return (Math.round(m*10)/10) + 'm';
  return Math.round(m) + 'm';
}
function dof(fmm, N, sM, c){
  const s = sM*1000, H = fmm*fmm/(N*c) + fmm;
  const near = s*(H - fmm)/(H + s - 2*fmm);
  const far = s < H ? s*(H - fmm)/(H - s) : Infinity;
  return {near: near/1000, far: far/1000, H: H/1000};
}
function useLabel(eq){
  if (eq < 21) return ['Ultra-wide','Huge landscapes, architecture, small rooms. Stretches things near the edges.'];

  if (eq < 135) return ['Short telephoto','Classic portrait range. Flattering faces, details.'];
  if (eq < 300) return ['Telephoto','Sports, events, distant details, compressed backgrounds.'];
  return ['Super-telephoto','Wildlife and birds. Needs fast shutter speeds.'];
}

const SCX = 598, SCY = 414, SW = 1200, REF_EQ = 14;
function frameRect(eq, sensor){
  const frac = Math.min(1, REF_EQ / eq);
  const w = SW * frac, h = w * sensor.h / sensor.w;
  return {x: SCX - w/2, y: SCY - h/2, w, h, frac};
}

/* ---------- Shared maths ---------- */
const SHUT_S = [...SHUT.map(d => 1/d), 2, 4, 8, 15, 30].sort((a,b) => b - a); // slow → fast
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const pct = x => (x < 1 ? x.toFixed(1) : Math.round(x)) + '%';

function compute(st){
  const lens = st.lens, sensor = SENSORS.find(s => s.id === st.sensorId);
  const [f0, f1] = lens.f;
  const f = clamp(st.focal, f0, f1);
  const {N: maxN, est} = maxApAt(lens, f);
  const apOptions = [maxN, ...STD.filter(s => s > maxN + 0.01)];
  const N = st.userN && st.userN >= maxN ? nearestLog(apOptions, st.userN) : maxN;
  const crop = sensor.crop, eq = f * crop;
  const hfov = 2*Math.atan(sensor.w/(2*f))*180/Math.PI;
  const dfov = 2*Math.atan(Math.hypot(sensor.w, sensor.h)/(2*f))*180/Math.PI;
  const coc = Math.hypot(sensor.w, sensor.h) / 1442;
  const D = dof(f, N, st.dist, coc);
  const depth = D.far - D.near;
  const fine = depth < 1;
  const fd = m => fmtDist(m, fine);
  const blurMm = st.dist*1000 > f ? f*f / (N * (st.dist*1000 - f)) : 0;
  const blurPct = blurMm / sensor.w * 100;
  const safeBase = 1/eq, safeT = safeBase * Math.pow(2, st.isStops);
  const light = LIGHT.find(l => l.id === st.lightId);
  const t100 = N*N / Math.pow(2, light.ev);
  let autoIso = 100, autoT = t100;
  if (t100 > safeT){ autoIso = ISOS.find(i => i >= 100 * t100 / safeT) || 51200; autoT = t100 * 100 / autoIso; }
  const err = Math.log2(st.shut * (st.iso/100) * Math.pow(2, light.ev) / (N*N));
  const fr = frameRect(eq, sensor);
  return {lens, sensor, f0, f1, f, maxN, est, apOptions, N, crop, eq, hfov, dfov, coc, D, depth, fd,
          blurMm, blurPct, safeBase, safeT, light, autoIso, autoT, err, fr,
          shut: st.shut, iso: st.iso, isStops: st.isStops, dist: st.dist, sensorId: st.sensorId, lightId: st.lightId};
}

/* feasibility helpers so every task can be done with whatever lens is loaded */
function focalSamples(lens){ const [a,b] = lens.f; if (a === b) return [a]; return Array.from({length: 61}, (_, i) => Math.round(logVal(i/60, a, b))); }
function maxBlurPct(lens, sensor){ return Math.max(...focalSamples(lens).map(f => f*f / (maxApAt(lens, f).N * (500 - f)) / sensor.w * 100)); }
function minDepth(lens, sensor){
  const c = Math.hypot(sensor.w, sensor.h) / 1442;
  return Math.min(...focalSamples(lens).map(f => { const d = dof(f, maxApAt(lens, f).N, 0.5, c); return d.far - d.near; }));
}
function minHyperNear(lens, sensor){
  const c = Math.hypot(sensor.w, sensor.h) / 1442, f = lens.f[0];
  return (f*f/(22*c) + f) / 2000;
}
function niceUp(x){ const s = [0.05,0.1,0.2,0.3,0.5,1,2,3,5,10,20,50]; return s.find(v => v >= x) || Math.ceil(x); }
function slowestSafe(limit){ return SHUT_S.find(t => t <= limit * 1.06); }

/* ---------- Visual pieces ---------- */
function SceneView({S}){
  const fr = S.fr;
  return html`<div class="view"><h3>The scene</h3>
    <svg viewBox="0 0 1200 800" role="img" aria-label="Wide scene with a box showing what the lens captures">
      <${SceneBack}/><${SceneFront}/>
      <rect x=${fr.x} y=${fr.y} width=${fr.w} height=${fr.h} fill="none" stroke="#e8a33a" stroke-width=${Math.max(3, fr.w/120)}/>
      ${fr.w < 60 ? html`<circle cx=${SCX} cy=${SCY} r="34" fill="none" stroke="#e8a33a" stroke-width="3" stroke-dasharray="8 6"/>` : ''}
    </svg>
    <div class="cap">Orange box = what ${Math.round(S.eq)}mm (full-frame equivalent) captures.</div></div>`;
}

function PreviewView({S, blur = true, shake = false, expose = false, title = 'What your camera sees'}){
  const fr = S.fr;
  const blurSd = blur ? Math.min(60, (S.blurMm / S.sensor.w) * fr.w / 2.2) : 0;
  const ratio = S.shut / S.safeT;
  const shakeSd = shake && ratio > 1 ? Math.min(fr.w * 0.04, fr.w * 0.003 * ratio) : 0;
  const bright = expose ? clamp(Math.pow(2, S.err), 0.12, 3.2) : 1;
  const grain = expose ? clamp((Math.log2(S.iso/100) - 2) / 7, 0, 0.55) : 0;
  return html`<div class="view"><h3>${title}</h3>
    <div style=${`filter:brightness(${bright.toFixed(2)});border-radius:8px;overflow:hidden`}>
    <svg viewBox=${`${fr.x} ${fr.y} ${fr.w} ${fr.h}`} role="img" aria-label="Simulated photo">
      <defs>
        <filter id="bgblur" x="-0.2" y="-0.2" width="1.4" height="1.4"><feGaussianBlur stdDeviation=${blurSd.toFixed(2)}/></filter>
        <filter id="shake" x="-0.2" y="-0.2" width="1.4" height="1.4"><feGaussianBlur stdDeviation=${`${shakeSd.toFixed(2)} ${(shakeSd*0.35).toFixed(2)}`}/></filter>
        <filter id="grain" x="0" y="0" width="1" height="1" filterUnits="objectBoundingBox"><feTurbulence type="fractalNoise" baseFrequency=${(2.2 * 1200 / fr.w / 4).toFixed(3)} numOctaves="2" seed="3"/><feColorMatrix type="saturate" values="0"/></filter>
      </defs>
      <g filter=${shakeSd > 0.05 ? 'url(#shake)' : null}>
        <g filter=${blurSd > 0.05 ? 'url(#bgblur)' : null}><${SceneBack}/></g>
        <${SceneFront}/>
      </g>
      ${grain > 0 ? html`<rect x=${fr.x} y=${fr.y} width=${fr.w} height=${fr.h} filter="url(#grain)" opacity=${grain.toFixed(2)} style="mix-blend-mode:overlay"/>` : ''}
    </svg></div>
    <div class="cap">${[blur ? `Focused on the bird at ${fmtDist(S.dist)}.` : '', shake ? (ratio > 1 ? `Shutter is ${ratio.toFixed(1)}× slower than safe, so the shot shakes.` : 'Shutter is fast enough: no shake.') : '', expose ? (Math.abs(S.err) <= 0.34 ? 'Exposure looks right.' : S.err < 0 ? 'Too dark.' : 'Too bright.') : ''].join(' ')}</div></div>`;
}

function FovDiagram({S}){
  const {f, f0, f1, hfov} = S;
  const W = 420, H = 190, cy = 85;
  const bl = 22 + (f1 > f0 ? logPos(f, f0, f1) * 50 : 20);
  const bx = 70 + bl, len = W - 10 - bx;
  const h = Math.tan(hfov/2*Math.PI/180) * len;
  return html`<div><h3>Field of view from above</h3><svg class="diag" viewBox=${`0 0 ${W} ${H}`} role="img" aria-label=${`Field of view ${Math.round(hfov)} degrees`}>
    <defs><clipPath id="fovclip"><rect x="0" y="4" width=${W} height=${H - 36}/></clipPath></defs>
    <g clip-path="url(#fovclip)"><polygon points=${`${bx},${cy} ${W-10},${cy-h} ${W-10},${cy+h}`} fill="#e8a33a" fill-opacity="0.22" stroke="#c07a1c" stroke-width="1"/></g>
    <line x1=${bx} y1=${cy} x2=${W-10} y2=${cy} stroke="currentColor" stroke-opacity="0.3" stroke-dasharray="4 4"/>
    <rect x="20" y=${cy-22} width="50" height="44" rx="6" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-opacity="0.4"/>
    <rect x="70" y=${cy-15} width=${bl} height="30" rx="3" fill="#7f77dd" fill-opacity="0.35" stroke="#534ab7"/>
    <text x="20" y=${H-10} font-size="13" fill="currentColor">${hfov < 10 ? hfov.toFixed(1) : Math.round(hfov)}° across · lens gets longer as you zoom</text>
  </svg></div>`;
}

function DofDiagram({S}){
  const {D, dist, fd} = S;
  const W = 420, H = 170, x0 = 40, x1 = 380, xinf = 405, lo = 0.3, hi = 200;
  const X = m => !isFinite(m) || m >= hi ? xinf : x0 + Math.max(0, logPos(Math.max(m, lo), lo, hi)) * (x1 - x0);
  const nx = X(D.near), fx = X(D.far), sx = X(dist);
  return html`<div><h3>What's in focus</h3><svg class="diag" viewBox=${`0 0 ${W} ${H}`} role="img" aria-label=${`Sharp from ${fd(D.near)} to ${fd(D.far)}`}>
    <rect x=${x0} y="50" width=${xinf - x0} height="36" rx="4" fill="currentColor" fill-opacity="0.06"/>
    <rect x=${nx} y="50" width=${Math.max(2, fx - nx)} height="36" rx="4" fill="#1d9e75" fill-opacity="0.35" stroke="#0f6e56"/>
    <rect x="10" y="56" width="22" height="24" rx="4" fill="currentColor" fill-opacity="0.3"/>
    <polygon points=${`${sx},46 ${sx-6},36 ${sx+6},36`} fill="#e8a33a"/>
    <text x=${clamp(sx, 70, W-60)} y="28" font-size="12" text-anchor="middle" fill="currentColor">focus ${fmtDist(dist)}</text>
    ${[0.5,1,2,5,10,20,50,100].map(t => html`<g><line x1=${X(t)} y1="86" x2=${X(t)} y2="92" stroke="currentColor" stroke-opacity="0.4"/><text x=${X(t)} y="106" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity="0.6">${t}m</text></g>`)}
    <text x=${xinf} y="106" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity="0.6">∞</text>
    <text x="10" y=${H-28} font-size="13" fill="currentColor">Sharp from ${fd(D.near)} to ${fd(D.far)}</text>
    <text x="10" y=${H-10} font-size="12" fill="currentColor" fill-opacity="0.7">Green band = acceptably sharp (log scale)</text>
  </svg></div>`;
}

function IrisDiagram({S}){
  const r = clamp(64 * 1.4 / S.N, 3, 64), cx = 80, cy = 80;
  const pts = Array.from({length: 7}, (_, i) => { const a = i/7 * 2*Math.PI - Math.PI/2; return `${(cx + r*Math.cos(a)).toFixed(1)},${(cy + r*Math.sin(a)).toFixed(1)}`; }).join(' ');
  const rel = Math.pow(S.maxN / S.N, 2);
  return html`<div><h3>The opening</h3><svg class="diag" viewBox="0 0 420 170" role="img" aria-label=${`Aperture f/${fN(S.N)}`}>
    <circle cx=${cx} cy=${cy} r="72" fill="currentColor" fill-opacity="0.75"/>
    <polygon points=${pts} fill="#f6d776"/>
    <text x="175" y="40" font-size="13" fill="currentColor">f/${fN(S.N)}: opening ≈ ${(S.f / S.N).toFixed(1)}mm wide</text>
    <text x="175" y="66" font-size="13" fill="currentColor">Light vs wide open (f/${fN(S.maxN)})</text>
    <rect x="175" y="76" width="220" height="16" rx="4" fill="currentColor" fill-opacity="0.1"/>
    <rect x="175" y="76" width=${Math.max(2, 220 * rel)} height="16" rx="4" fill="#e8a33a"/>
    <text x="175" y="112" font-size="13" fill="currentColor">${Math.round(rel*100)}% of the light · ${stopsBetween(S.maxN, S.N).toFixed(1)} stops darker</text>
  </svg></div>`;
}

function ApertureChart({S}){
  const {lens, f, f0, f1} = S;
  const W = 420, H = 190, x0 = 46, x1 = 400, y0 = 24, y1 = 140;
  const a0 = lens.a[0], a1 = Math.max(lens.a[1], a0 * 1.12);
  const X = v => f1 > f0 ? x0 + logPos(v, f0, f1) * (x1 - x0) : (x0 + x1)/2;
  const Y = n => y0 + logPos(n, a0, a1) * (y1 - y0);
  const pts = focalSamples(lens).map(v => `${X(v).toFixed(1)},${Y(maxApAt(lens, v).N).toFixed(1)}`).join(' ');
  const cur = maxApAt(lens, f).N;
  return html`<div><h3>Widest aperture across the zoom</h3><svg class="diag" viewBox=${`0 0 ${W} ${H}`} role="img" aria-label="Max aperture by focal length">
    <line x1=${x0} y1=${y1} x2=${x1} y2=${y1} stroke="currentColor" stroke-opacity="0.3"/>
    <polyline points=${pts} fill="none" stroke="#534ab7" stroke-width="2"/>
    <circle cx=${X(f)} cy=${Y(cur)} r="6" fill="#e8a33a"/>
    <text x=${x0 - 6} y=${Y(a0) + 4} font-size="11" text-anchor="end" fill="currentColor" fill-opacity="0.7">f/${fN(a0)}</text>
    ${lens.a[1] > a0 ? html`<text x=${x0 - 6} y=${Y(lens.a[1]) + 4} font-size="11" text-anchor="end" fill="currentColor" fill-opacity="0.7">f/${fN(lens.a[1])}</text>` : ''}
    <text x=${x0} y=${y1 + 18} font-size="11" fill="currentColor" fill-opacity="0.7">${f0}mm</text>
    <text x=${x1} y=${y1 + 18} font-size="11" text-anchor="end" fill="currentColor" fill-opacity="0.7">${f1}mm</text>
    <text x=${x0} y=${H - 8} font-size="13" fill="currentColor">At ${f}mm the widest is f/${fN(cur)}${S.est ? ' (estimated)' : ''}. Lower on the chart = less light.</text>
  </svg></div>`;
}

function Meter({S}){
  const e = clamp(S.err, -3, 3), W = 420, x = 30 + (e + 3) / 6 * 360;
  return html`<div><h3>Light meter</h3><svg class="diag" viewBox=${`0 0 ${W} 110`} role="img" aria-label=${`Exposure ${S.err.toFixed(1)} stops`}>
    <rect x="30" y="30" width="360" height="14" rx="4" fill="currentColor" fill-opacity="0.1"/>
    <rect x="200" y="30" width="20" height="14" fill="#1d9e75" fill-opacity="0.5"/>
    ${[-3,-2,-1,0,1,2,3].map(v => html`<g><line x1=${30 + (v+3)*60} y1="44" x2=${30 + (v+3)*60} y2="52" stroke="currentColor" stroke-opacity="0.5"/><text x=${30 + (v+3)*60} y="66" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity="0.7">${v > 0 ? '+' + v : v}</text></g>`)}
    <polygon points=${`${x},28 ${x-7},16 ${x+7},16`} fill="#e8a33a"/>
    <text x="30" y="94" font-size="13" fill="currentColor">${Math.abs(S.err) <= 0.34 ? 'Correct exposure' : `${Math.abs(S.err).toFixed(1)} stops too ${S.err < 0 ? 'dark' : 'bright'}`}</text>
  </svg></div>`;
}

    intro: 'Depth of field is how much of the scene, front to back, looks sharp. Three things make it thinner: a wider aperture (smaller f-number), a longer focal length, and focusing closer.',
    idea: 'For portraits, shallow depth isolates the subject. For landscapes, stop down and focus about a third into the scene to get everything sharp.',
    controls: ['zoom', 'aperture', 'focus'],
    visuals: S => html`<div class="two"><${PreviewView} S=${S}/><${DofDiagram} S=${S}/></div>`,
    tasks: S => {
      const thin = niceUp(minDepth(S.lens, S.sensor) * 1.5);
      const near = Math.max(3, Math.ceil(minHyperNear(S.lens, S.sensor) * 1.15));
      return [
        {id: 'thin', text: `Make the sharp zone thinner than ${fmtDist(thin)}.`, ok: S.depth < thin},
        {id: 'deep', text: `Get everything from ${near}m to the horizon (∞) sharp.`, ok: S.D.near <= near && !isFinite(S.D.far)},
      ];
    },
    quiz: {q: 'Which gives the shallowest depth of field?', opts: ['24mm at f/8, subject 10m away', '85mm at f/1.8, subject 2m away', '18mm at f/11, subject 5m away'], ans: 1, why: 'Long focal length, wide aperture and close focus all shrink the sharp zone.'},
  },
  {
    id: 'background-blur', title: 'Background blur',
    intro: 'A distant background blurs more when the lens is longer, the aperture wider, and the subject closer. With slow superzooms, zooming in and getting close is usually the best way to blur the background.',
    idea: 'Blur grows with focal length squared, so zooming in helps more than the slightly smaller aperture hurts.',
    controls: ['zoom', 'aperture', 'focus'],
    visuals: S => html`<div class="two"><${PreviewView} S=${S}/><div><div class="metrics">
        <div class="metric"><div class="k">Background blur</div><div class="val">${pct(S.blurPct)}</div><div class="s">of frame width</div></div>
        <div class="metric"><div class="k">Look</div><div class="val">${S.blurPct < 0.3 ? 'Sharp' : S.blurPct < 1.5 ? 'Soft' : S.blurPct < 4 ? 'Blurred' : 'Creamy'}</div></div>
      </div><p class="hint">Blur disc = f² ÷ (N × (distance − f)), compared with the sensor width.</p></div></div>`,
    tasks: S => {
      const target = Math.min(4, Math.floor(maxBlurPct(S.lens, S.sensor) * 0.7 * 10) / 10);
      return [
        {id: 'blur', text: `Blur the background to at least ${target}% of the frame.`, ok: S.blurPct >= target},
        {id: 'sharp', text: 'Now make the background almost sharp (under 0.3%).', ok: S.blurPct < 0.3},
      ];
    },
    quiz: {q: 'Your 18-200mm shot has a busy background. What blurs it most?', opts: ['Zoom in to 200mm and move closer to the subject', 'Stop down to f/16', 'Zoom out to 18mm and step back'], ans: 0, why: 'Longer focal length and closer distance increase blur far more than the change from f/3.5 to f/6.3 reduces it.'},
  },
  {
    id: 'shutter-speed', title: 'Shutter speed and shake',
    intro: 'Shutter speed is how long the sensor collects light. Handheld, slow speeds blur from your hands shaking, and long lenses magnify that shake. Rule of thumb: use at least 1 ÷ equivalent focal length. Stabilization (IS) lets you go slower for still subjects.',
    idea: 'Safe handheld speed ≈ 1/(focal length × crop). Each stop of IS lets you halve it. Moving subjects still need fast speeds.',
    controls: ['zoom', 'is', 'shutter'],
    visuals: S => html`<div class="two"><${PreviewView} S=${S} blur=${false} shake=${true}/><div><div class="metrics">
        <div class="metric"><div class="k">Safe without IS</div><div class="val">${fmtShutter(S.safeBase)}</div></div>
        <div class="metric"><div class="k">Safe with ${S.isStops}-stop IS</div><div class="val">${fmtShutter(S.safeT)}</div></div>
        <div class="metric"><div class="k">Your shutter</div><div class="val">${fmtShutter(S.shut)}</div><div class="s">${S.shut <= S.safeT * 1.06 ? 'steady' : 'shaky'}</div></div>
      </div></div></div>`,
    tasks: S => {
      const safe = slowestSafe(S.safeBase);
      return [
        {id: 'long', text: `IS off, zoomed to ${S.f1}mm: choose the slowest shutter speed that's still safe (${fmtShutter(safe)}).`, ok: S.isStops === 0 && S.f === S.f1 && S.shut === slowestSafe(1/(S.f1*S.crop))},
        {id: 'is', text: 'Turn on 3 stops of IS and pick a shutter at least 2 stops slower that is still steady.', ok: S.isStops >= 3 && S.shut >= S.safeBase * 3.9 && S.shut <= S.safeT * 1.06},
        {id: 'freeze', text: 'A dog runs past. Pick a speed that freezes motion: 1/500 or faster.', ok: S.shut <= 1/500 + 1e-9},
      ];
    },
    quiz: {q: 'Handheld at 200mm on a 1.5× crop camera with no IS, a safe shutter speed is about…', opts: ['1/30', '1/320', '1/8000'], ans: 1, why: '200 × 1.5 = 300mm equivalent, so about 1/300. The nearest standard speed is 1/320.'},
  },
  {
    id: 'exposure', title: 'Exposure triangle',
    intro: 'Aperture, shutter speed and ISO together set brightness. Any one can make up for another: open up a stop, and you can use a shutter one stop faster or an ISO one stop lower. ISO brightens electronically but adds grain.',
    idea: 'Get the meter to 0. Choose aperture for depth of field, shutter for sharpness, then raise ISO only as much as you need.',
    controls: ['light', 'aperture', 'shutter', 'iso', 'zoom'],
    visuals: S => html`<div class="two"><${PreviewView} S=${S} shake=${true} expose=${true}/><div><${Meter} S=${S}/>
      <div class="hint">Camera's auto suggestion at f/${fN(S.N)}: ${fmtShutter(S.autoT)}, ISO ${S.autoIso}.</div></div></div>`,
    tasks: S => {
      const minIso = Math.min(...focalSamples(S.lens).map(v => { const n = maxApAt(S.lens, v).N; return 100 * n * n / (Math.pow(2, 6) * (Math.pow(2, S.isStops) / (v * S.crop))); }));
      const isoCap = Math.max(3200, ISOS.find(i => i >= minIso) || 51200);
      const ok = Math.abs(S.err) <= 0.34;
      return [
        {id: 'sun', text: 'Choose "Bright sun" and get a correct exposure (meter at 0).', ok: S.lightId === 'sun' && ok},
        {id: 'evening', text: 'Switch to "Home in the evening". Get a correct exposure while staying handheld-steady.', ok: S.lightId === 'home' && ok && S.shut <= S.safeT * 1.06},
        {id: 'clean', text: `Same scene, but keep ISO at ${isoCap} or lower. Hint: zoom out and open the aperture.`, ok: S.lightId === 'home' && ok && S.shut <= S.safeT * 1.06 && S.iso <= isoCap},
      ];
    },
    quiz: {q: 'Your photo is one stop too dark. Which change fixes it?', opts: ['ISO 200 → 400', 'f/4 → f/5.6', '1/250 → 1/500'], ans: 0, why: 'Doubling ISO adds one stop of brightness. The other two each take away a stop.'},
  },
];

/* ---------- Controls ---------- */
function Controls({S, show, set}){
  const has = k => show.includes(k);
  const presets = [...new Set([S.f0, ...[24,35,50,85,135,200,300,400,600].filter(p => p > S.f0 && p < S.f1), S.f1])];
  const apIdx = Math.max(0, S.apOptions.indexOf(S.N));
  const shIdx = SHUT_S.indexOf(S.shut), isoIdx = ISOS.indexOf(S.iso);
  return html`<div class="controls">
    ${has('sensor') ? html`<div class="ctl"><span class="n">Sensor</span><select value=${S.sensorId} onChange=${e => set.sensorId(e.target.value)} aria-label="Sensor">${SENSORS.map(s => html`<option value=${s.id}>${s.name}</option>`)}</select><span class="v">${S.crop.toFixed(2)}×</span></div>` : ''}
    ${has('light') ? html`<div class="ctl"><span class="n">Light</span><select value=${S.lightId} onChange=${e => set.lightId(e.target.value)} aria-label="Light">${LIGHT.map(l => html`<option value=${l.id}>${l.name}</option>`)}</select><span class="v">EV ${S.light.ev}</span></div>` : ''}
    ${has('zoom') && S.f1 > S.f0 ? html`
      <div class="ctl"><span class="n">Zoom</span>
        <input type="range" min="0" max="1000" step="1" value=${Math.round(logPos(S.f, S.f0, S.f1)*1000)} aria-label="Focal length" onInput=${e => set.focal(Math.round(logVal(+e.target.value/1000, S.f0, S.f1)))}/>
        <span class="v">${S.f}mm</span></div>
      <div class="presets">${presets.map(p => html`<button class=${p === S.f ? 'on' : ''} onClick=${() => set.focal(p)}>${p}mm</button>`)}</div>` : ''}
    ${has('zoom') && S.f1 === S.f0 ? html`<div class="hint">Prime lens: fixed at ${S.f}mm.</div>` : ''}
    ${has('aperture') ? html`<div class="ctl"><span class="n">Aperture</span>
        <input type="range" min="0" max=${S.apOptions.length - 1} step="1" value=${apIdx} aria-label="Aperture" onInput=${e => set.userN(+e.target.value === 0 ? null : S.apOptions[+e.target.value])}/>
        <span class="v">f/${fN(S.N)}</span></div>` : ''}
    ${has('focus') ? html`<div class="ctl"><span class="n">Focus at</span>
        <input type="range" min="0" max="1000" step="1" value=${Math.round(logPos(S.dist, 0.5, 100)*1000)} aria-label="Subject distance" onInput=${e => set.dist(Math.round(logVal(+e.target.value/1000, 0.5, 100)*10)/10)}/>
        <span class="v">${fmtDist(S.dist)}</span></div>` : ''}
    ${has('is') ? html`<div class="ctl"><span class="n">Stabilization</span><select value=${S.isStops} onChange=${e => set.isStops(+e.target.value)} aria-label="Stabilization">${[0,1,2,3,4,5].map(n => html`<option value=${n}>${n === 0 ? 'Off' : n + ' stops'}</option>`)}</select><span class="v"></span></div>` : ''}
    ${has('shutter') ? html`<div class="ctl"><span class="n">Shutter</span>
        <input type="range" min="0" max=${SHUT_S.length - 1} step="1" value=${shIdx} aria-label="Shutter speed" onInput=${e => set.shut(SHUT_S[+e.target.value])}/>
        <span class="v">${fmtShutter(S.shut)}</span></div>` : ''}
    ${has('iso') ? html`<div class="ctl"><span class="n">ISO</span>
        <input type="range" min="0" max=${ISOS.length - 1} step="1" value=${isoIdx} aria-label="ISO" onInput=${e => set.iso(ISOS[+e.target.value])}/>
        <span class="v">${S.iso}</span></div>` : ''}
  </div>`;
}

/* ---------- Module page ---------- */
function Quiz({quiz, answer, onAnswer}){
  return html`<div class="quiz"><h3>Check yourself</h3><p style="margin:4px 0 8px">${quiz.q}</p>
    <div class="opts">${quiz.opts.map((o, i) => html`<button class=${answer === i ? (i === quiz.ans ? 'right' : 'wrong') : ''} onClick=${() => onAnswer(i)}>${o}</button>`)}</div>
    ${answer != null ? html`<div class=${'note ' + (answer === quiz.ans ? 'good' : 'warn')}>${answer === quiz.ans ? 'Correct. ' : 'Not quite, try another. '}${answer === quiz.ans ? quiz.why : ''}</div>` : ''}
  </div>`;
}

function ModulePage({m, idx, S, set, done, answers, onAnswer, go}){
  const tasks = m.tasks(S);
  let blocked = false;
  return html`<div>
    <div class="card">
      <div class="hint">Module ${idx + 1} of ${MODULES.length + 1}</div>
      <h2 style="font-size:21px;margin:2px 0 8px">${m.title}</h2>
      <p style="margin:0 0 8px">${m.intro}</p>
      <div class="idea"><b>Key idea:</b> ${m.idea}</div>
    </div>
    <div class="card"><${Controls} S=${S} show=${m.controls} set=${set}/></div>
    <div class="card">${m.visuals(S)}</div>
    <div class="card">
      <h3>Practice</h3>
      <ol class="tasks">${tasks.map(t => {
        const key = m.id + '.' + t.id, isDone = done[key] || t.na;
        const locked = blocked && !isDone;
        if (!isDone) blocked = true;
        return html`<li class=${isDone ? 'done' : locked ? 'locked' : 'active'}>
          <span class="tick">${isDone ? '✓' : ''}</span>
          <span>${t.text}${t.na ? html` <span class="badge">doesn't apply to this lens</span>` : ''}${locked ? html` <span class="badge">finish the step above first</span>` : ''}</span></li>`;
      })}</ol>
      <${Quiz} quiz=${m.quiz} answer=${answers[m.id]} onAnswer=${i => onAnswer(m.id, i)}/>
    </div>
    <div class="navbtns">
      <button onClick=${() => go(idx - 1)} disabled=${idx === 0}>← Back</button>
      <button class="primary" onClick=${() => go(idx + 1)}>${idx === MODULES.length - 1 ? 'Go to the playground →' : 'Next module →'}</button>
    </div>
  </div>`;
}

/* ---------- Playground (all controls) ---------- */
function Playground({S, set, go}){
  const [useName, useText] = useLabel(S.eq);
  return html`<div>
    <div class="card"><div class="hint">Module ${MODULES.length + 1} of ${MODULES.length + 1}</div>
      <h2 style="font-size:21px;margin:2px 0 8px">Playground</h2>
      <p style="margin:0">Everything together. Try a real situation: a portrait at dusk, a bird in a tree, a landscape at noon.</p></div>
    <div class="card"><${Controls} S=${S} show=${['sensor','light','zoom','aperture','focus','is','shutter','iso']} set=${set}/>
      <div class="presets" style="margin-left:0"><button onClick=${() => { set.shut(slowestSafe(S.autoT)); set.iso(S.autoIso); }}>Auto exposure</button></div></div>
    <div class="card"><div class="metrics">
      <div class="metric"><div class="k">Full-frame equivalent</div><div class="val">${Math.round(S.eq)}mm</div><div class="s">${useName}</div></div>
      <div class="metric"><div class="k">Angle of view</div><div class="val">${S.hfov < 10 ? S.hfov.toFixed(1) : Math.round(S.hfov)}°</div></div>
      <div class="metric"><div class="k">Widest aperture here</div><div class="val">f/${fN(S.maxN)}</div><div class="s">${S.est ? 'estimated' : 'from spec'}</div></div>
      <div class="metric"><div class="k">Sharp zone</div><div class="val">${isFinite(S.depth) ? S.fd(S.depth) : '∞'}</div><div class="s">${S.fd(S.D.near)} to ${S.fd(S.D.far)}</div></div>
      <div class="metric"><div class="k">Background blur</div><div class="val">${pct(S.blurPct)}</div></div>
      <div class="metric"><div class="k">Exposure</div><div class="val">${Math.abs(S.err) <= 0.34 ? 'OK' : (S.err > 0 ? '+' : '') + S.err.toFixed(1)}</div><div class="s">stops</div></div>
    </div><p class="hint" style="margin-bottom:0">${useText}</p></div>
    <div class="card"><div class="two"><${SceneView} S=${S}/><${PreviewView} S=${S} shake=${true} expose=${true}/></div></div>
    <div class="card"><div class="two"><${DofDiagram} S=${S}/><${Meter} S=${S}/></div></div>
    <div class="navbtns"><button onClick=${() => go(MODULES.length - 1)}>← Back</button><span></span></div>
  </div>`;
}

/* ---------- App shell ---------- */
const STORE = 'lenslab-v2';
function loadSaved(){ try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { return {}; } }
function hashIndex(){ try { const h = location.hash.slice(1); const i = MODULES.findIndex(m => m.id === h); return h === 'playground' ? MODULES.length : i; } catch (e) { return -1; } }

function App(){
  const saved = useMemo(loadSaved, []);
  const startText = saved.text && parseLens(saved.text) ? saved.text : '18-200mm f/4-6.3';
  const startLib = saved.lensId && LENSES.find(l => l.id === saved.lensId);
  const [text, setText] = useState(startLib ? specText(startLib) : startText);
  const [lens, setLens] = useState(() => startLib || {id: 'custom', n: 'Your lens', ...parseLens(startText), fmt: null, is: true});
  const [sensorId, setSensorId] = useState(saved.sensorId || 'apsc');
  const [focal, setFocal] = useState(lens.f[0]);
  const [userN, setUserN] = useState(null);
  const [dist, setDist] = useState(4);
  const [isStops, setIsStops] = useState(3);
  const [lightId, setLightId] = useState('overcast');
  const [shut, setShut] = useState(1/250);
  const [iso, setIso] = useState(100);
  const [done, setDone] = useState(saved.done || {});
  const [answers, setAnswers] = useState(saved.answers || {});
  const [page, setPage] = useState(() => { const h = hashIndex(); return h >= 0 ? h : 0; });

  const st = {lens, sensorId, focal, userN, dist, isStops, lightId, shut, iso};
  const S = compute(st);
  const set = {focal: setFocal, userN: setUserN, dist: setDist, isStops: setIsStops, lightId: setLightId, shut: setShut, iso: setIso, sensorId: setSensorId};

  // record tasks the moment they are met, in order
  const m = MODULES[page];
  if (m){
    let blocked = false, add = null;
    for (const t of m.tasks(S)){
      const key = m.id + '.' + t.id;
      if (done[key] || t.na) continue;
      if (blocked) break;
      if (t.ok){ add = add || {}; add[key] = true; } else blocked = true;
    }
    if (add) setTimeout(() => setDone(d => ({...d, ...add})), 0);
  }

  useEffect(() => { try { localStorage.setItem(STORE, JSON.stringify({text, lensId: lens.id === 'custom' ? null : lens.id, sensorId, done, answers})); } catch (e) {} }, [text, lens, sensorId, done, answers]);
  useEffect(() => {
    const onHash = () => { const h = hashIndex(); if (h >= 0) setPage(h); };
    try { window.addEventListener('hashchange', onHash); } catch (e) {}
    return () => { try { window.removeEventListener('hashchange', onHash); } catch (e) {} };
  }, []);

  function go(i){
    i = clamp(i, 0, MODULES.length);
    setPage(i);
    try { location.hash = i === MODULES.length ? 'playground' : MODULES[i].id; } catch (e) {}
    try { window.scrollTo(0, 0); } catch (e) {}
  }
  function pickLens(l){
    setLens(l); setFocal(l.f[0]); setUserN(null);
    setSensorId(sensorFor(l, sensorId)); setIsStops(l.is ? 3 : 0); setText(specText(l));
  }
  function onText(v){
    setText(v);
    const p = parseLens(v);
    if (p){ setLens({id: 'custom', n: 'Your lens', ...p, fmt: null, is: isStops > 0}); setFocal(x => clamp(x, p.f[0], p.f[1])); setUserN(null); }
  }
  const parsed = parseLens(text);
  const modDone = mod => {
    const tasks = mod.tasks(compute({...st}));
    return tasks.every(t => t.na || done[mod.id + '.' + t.id]) && answers[mod.id] === mod.quiz.ans;
  };
  const completed = MODULES.filter(modDone).length;
  const fmtMismatch = lens.fmt && lens.fmt !== S.sensor.fmt;

  return html`<div class="wrap">
    <h1>Photography 101</h1>
    <p class="sub">Learn what your lens does, one idea at a time. Each module has practice tasks that tick off as you get them right.</p>
    <div class="lensbar card">
      <div><label class="lbl" for="lensin">Your lens</label>
        <input id="lensin" type="text" value=${text} placeholder="18-200mm f/3.5-6.3" onInput=${e => onText(e.target.value)}/>
        ${parsed ? '' : html`<div class="err">Type a range and f-stop, like 18-200mm f/4-6.3 or 50mm f/1.8.</div>`}</div>
      <div><label class="lbl" for="libsel">Or pick a lens</label>
        <select id="libsel" value=${lens.id} onChange=${e => { const l = LENSES.find(x => x.id === e.target.value); if (l) pickLens(l); }}>
          <option value="custom">Your typed lens</option>
          ${CATS.filter(c => c[0] !== 'all').map(([id, nm]) => html`<optgroup label=${nm}>${LENSES.filter(l => l.cat === id).map(l => html`<option value=${l.id}>${l.n} (${l.fmt})</option>`)}</optgroup>`)}
        </select></div>
      <div><label class="lbl" for="sensor">Camera sensor</label>
        <select id="sensor" value=${sensorId} onChange=${e => setSensorId(e.target.value)}>${SENSORS.map(s => html`<option value=${s.id}>${s.name}</option>`)}</select></div>
      ${fmtMismatch ? html`<div class="note warn" style="grid-column:1/-1;margin-top:0">${lens.fmt === 'APS-C' && S.sensor.fmt === 'FF' ? 'This lens is made for APS-C. On full frame the corners go dark, so most cameras switch to crop mode.' : `This lens is made for ${lens.fmt} cameras; numbers show what it would do on the sensor you picked.`}</div>` : ''}
    </div>
    <div class="layout2">
      <nav class="card modnav" aria-label="Modules">
        <div class="hint" style="margin-bottom:6px">${completed} of ${MODULES.length} modules complete</div>
        <div class="progress"><span style=${`width:${completed / MODULES.length * 100}%`}></span></div>
        ${MODULES.map((mod, i) => html`<button class=${'modbtn' + (page === i ? ' on' : '')} onClick=${() => go(i)}>
          <span class=${'num' + (modDone(mod) ? ' ok' : '')}>${modDone(mod) ? '✓' : i + 1}</span>${mod.title}</button>`)}
        <button class=${'modbtn' + (page === MODULES.length ? ' on' : '')} onClick=${() => go(MODULES.length)}><span class="num">★</span>Playground</button>
        <button class="reset" onClick=${() => { setDone({}); setAnswers({}); }}>Reset progress</button>
      </nav>
      <main>
        ${page < MODULES.length
          ? html`<${ModulePage} m=${MODULES[page]} idx=${page} S=${S} set=${set} done=${done} answers=${answers} onAnswer=${(id, i) => setAnswers(a => ({...a, [id]: i}))} go=${go}/>`
          : html`<${Playground} S=${S} set=${set} go=${go}/>`}
        <footer>Lens specs come from manufacturer pages and reviews (DxOMark, Cameralabs, mirrorlesscomparison.com). Middle-of-zoom apertures are estimated unless the lens lists exact steps. Depth of field, blur and exposure are simplified models meant for learning.</footer>
      </main>
    </div>
  </div>`;
}
function specText(l){ return `${l.f[0]}${l.f[1] !== l.f[0] ? '-' + l.f[1] : ''}mm f/${fN(l.a[0])}${l.a[1] !== l.a[0] ? '-' + fN(l.a[1]) : ''}`; }

render(html`<${App}/>`, document.getElementById('app'));

</script>
</body>
</html>
